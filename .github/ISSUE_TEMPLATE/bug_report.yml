name: Bug Report
description: Report an issue, defect, or unexpected behavior in PEC implementation or specs
title: "[BUG]: <concise title>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with the DePIN-Mesh PEC repository.
        Please provide detailed diagnostic information below.
  - type: dropdown
    id: component
    attributes:
      label: Affected Subsystem
      description: Select the subsystem where the defect manifests.
      options:
        - "spec: Formal Protocol Specifications (RFCs)"
        - "proto: Protobuf Schemas (v1)"
        - "crates/pec-core: Core Data Structures / PEH"
        - "crates/pec-vm: Execution Engine / Math Profile"
        - "firmware: Embedded Transducer / RoT Logic"
        - "relayer: P2P Transport and Synchronization"
        - "docs: Documentation & Governance"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the defect, including observed versus expected physical or deterministic behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, test cases, or data inputs to reproduce the behavior.
      value: |
        1. Compile target with ...
        2. Execute verification routine with input vector ...
        3. Observe discrepancy in ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Target Environment & Hardware Configuration
      description: Architecture, OS version, hardware secure element (if applicable), and compiler version.
      placeholder: "OS: Linux x86_64, Rust: 1.82, Hardware RoT: Microchip ATECC608B"
    validations:
      required: false
