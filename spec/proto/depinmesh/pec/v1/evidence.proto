syntax = "proto3";

package depinmesh.pec.v1;

// Deterministic signed Q64.64 fixed-point number representation (PEC-MATH-01).
// Value = raw_value * 2^(-64)
message FixedPointQ64 {
  // Signed 128-bit integer stored as two 64-bit words (little-endian representation).
  uint64 low_fraction = 1;
  int64 high_integer = 2;
}

// Classification of physical evidence payloads.
enum EvidenceType {
  EVIDENCE_TYPE_UNSPECIFIED = 0;
  EVIDENCE_TYPE_SENSOR_TELEMETRY = 1;
  EVIDENCE_TYPE_HARDWARE_ATTESTATION = 2;
  EVIDENCE_TYPE_ENVIRONMENTAL_OBSERVATION = 3;
  EVIDENCE_TYPE_ACTUATION_RESPONSE = 4;
  EVIDENCE_TYPE_WITNESS_CROSS_VALIDATION = 5;
}

// Certified authority envelope constraining transducer validity (A_obs).
message ObservationAuthorityEnvelope {
  // Certified dynamic range bounds [v_min, v_max]
  FixedPointQ64 min_admissible_value = 1;
  FixedPointQ64 max_admissible_value = 2;

  // Maximum slew rate |dv/dt|_max
  FixedPointQ64 max_slew_rate = 3;

  // Nyquist sampling bounds in Hertz
  FixedPointQ64 min_sampling_frequency = 4;
  FixedPointQ64 max_sampling_frequency = 5;

  // Standard expanded measurement uncertainty (ISO/IEC Guide 98-3)
  FixedPointQ64 standard_uncertainty = 6;

  // Certificate expiration timestamp in Unix epoch seconds
  uint64 certificate_expiration_epoch = 7;
}

// Calibration polynomial mapping raw voltage/count to SI units.
message CalibrationVector {
  // Polynomial coefficients [c0, c1, c2, ...] where v_si = sum(c_i * v_raw^i)
  repeated FixedPointQ64 polynomial_coefficients = 1;

  // Cryptographic hash of the manufacturer calibration certificate
  bytes calibration_certificate_digest = 2;

  // Date/time epoch when last accredited recalibration occurred
  uint64 recalibration_epoch = 3;
}

// Quantized physical transducer telemetry reading.
message TransducerReading {
  // SI physical unit tag (for example, "kelvin", "pascal", "meters_per_second_squared")
  string physical_unit = 1;

  // Deterministic fixed-point reading value in specified SI unit
  FixedPointQ64 quantized_value = 2;

  // High-precision sampling timestamp (nanoseconds since Unix epoch)
  uint64 sample_timestamp_ns = 3;

  // Hardware channel or sensor index on the device
  uint32 channel_index = 4;
}

// Hardware attestation evidence generated by silicon Root of Trust.
message HardwareAttestationEnvelope {
  // Attestation format identifier (for example, "TCG_DICE", "PSA_ATTESTATION", "APPLE_SE")
  string attestation_format = 1;

  // Silicon Root of Trust identifier or public key
  bytes public_key_bytes = 2;

  // Monotonic silicon counter value preventing replay
  uint64 monotonic_counter = 3;

  // Firmware image cryptographic digest (PCR / measurement register)
  bytes firmware_measurement = 4;

  // Silicon-signed attestation token bytes
  bytes raw_token = 5;
}

// Primary evidence envelope ingested by the Physical Evidence Hypergraph (PEH).
message PhysicalEvidenceObject {
  // Unique 256-bit evidence identifier: SHA-256(canonical_protobuf_bytes)
  bytes evidence_id = 1;

  // Evidence classification category
  EvidenceType evidence_type = 2;

  // Node hardware identifier (Ed25519 public key)
  bytes attester_node_id = 3;

  // High-precision evidence generation timestamp in Unix epoch nanoseconds
  uint64 timestamp_ns = 4;

  // Active observation authority envelope
  ObservationAuthorityEnvelope authority_envelope = 5;

  // Active calibration parameters
  CalibrationVector calibration_vector = 6;

  // Transducer measurements contained within this evidence frame
  repeated TransducerReading readings = 7;

  // Optional silicon root of trust attestation payload
  HardwareAttestationEnvelope hardware_attestation = 8;

  // Geospatial context coordinates if certified (WGS84 fixed-point)
  FixedPointQ64 latitude = 9;
  FixedPointQ64 longitude = 10;
  FixedPointQ64 altitude_meters = 11;

  // Ed25519 signature of the attester over canonical serialization
  bytes cryptographic_signature = 12;
}
