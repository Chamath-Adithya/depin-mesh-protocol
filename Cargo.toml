[workspace]
resolver = "2"
members = [
    "crates/pec-core",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
authors = ["DePIN-Mesh Protocol Working Group <architect@depinmesh.org>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/depin-mesh/depin-mesh-protocol"
readme = "README.md"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
